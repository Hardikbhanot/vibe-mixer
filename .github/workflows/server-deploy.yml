  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.206.65.227
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            docker pull ghcr.io/${{ github.repository_owner }}/vibe-mixer/server:latest

            docker stop vibe-mixer-server || true
            docker rm vibe-mixer-server || true

            docker run -d \
              --name vibe-mixer-server \
              --network app-net \
              --restart always \
              --env-file /home/ubuntu/vibe-mixer.env \
              -p 80:4000 \
              ghcr.io/${{ github.repository_owner }}/vibe-mixer/server:latest

            docker image prune -f
